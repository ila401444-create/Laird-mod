name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.10-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip mod.zip -d ./project
          ls -la ./project

      - name: Compile Laird
        run: |
          cd ./project
          pawncc gamemodes/laird.pwn -i pawno/include -d3 -Z

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          path: project/**/*.amx
