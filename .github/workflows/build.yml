name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.10-linux
    steps:
      # 1. Устанавливаем unzip (в образе его нет)
      - name: Install unzip
        run: |
          apt-get update && apt-get install -y unzip

      # 2. Клонируем репозиторий (checkout не работает в этом образе из-за Node)
      - name: Clone repo
        run: |
          # Устанавливаем git, если его нет (обычно в Debian/Ubuntu он есть, но на всякий случай)
          apt-get install -y git
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 3. Распаковываем архив
      - name: Unzip project
        run: |
          unzip mod.zip -d ./project
          ls -la ./project

      # 4. Компилируем
      - name: Compile Laird
        run: |
          cd ./project
          pawncc gamemodes/laird.pwn -i pawno/include -d3 -Z

      # 5. Выгружаем результат
      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          path: project/**/*.amx
