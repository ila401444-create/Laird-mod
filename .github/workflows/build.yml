name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.10-linux
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y unzip

      - name: Clone repo
        run: |
          # Клонируем в отдельную папку, чтобы не было проблем с точкой
          git clone --depth 1 https://github.com/${{ github.repository }}.git /tmp/repo
          # Переносим только mod.zip в рабочую директорию
          cp /tmp/repo/mod.zip .

      - name: Unzip project
        run: |
          # Распаковываем архив. Папка "мод моего проекта" появится здесь же.
          unzip mod.zip -d ./project
          echo "=== Содержимое папки project ==="
          ls -la ./project

      - name: Compile Laird
        run: |
          # Заходим в папку "мод моего проекта" напрямую
          cd "./project/мод моего проекта"
          
          # Заходим в gamemodes и компилируем
          cd gamemodes
          
          # Запускаем компилятор, указывая путь к инклудам на уровень выше
          pawncc laird.pwn -i ../pawno/include -d3 -Z

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          # Ищем файл .amx
          path: project/**/*.amx
