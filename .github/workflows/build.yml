- name: Install 32-bit libs
  run: |
    sudo dpkg --add-architecture i386
    sudo apt-get update
    sudo apt-get install -y libc6:i386

- name: Download Pawn compiler
  run: |
    wget -O pawncc.tar.gz https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
    tar -xzf pawncc.tar.gz
    chmod +x pawnc-3.10.10-linux/bin/pawncc

- name: Compile Laird
  run: |
    cd ./project
    ../pawnc-3.10.10-linux/bin/pawncc gamemodes/laird.pwn -i pawno/include -d3 -Z
