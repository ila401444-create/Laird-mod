name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: sacnr/pawncc
    steps:
      # 1. Удаляем checkout и клонируем вручную (обход отсутствия Node)
      - name: Checkout (plain git)
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .
          ls -la

      - name: Unzip project
        run: |
          unzip mod.zip -d ./project
          ls -la ./project

      - name: Compile Laird
        run: |
          cd ./project
          /pawnc/bin/pawncc gamemodes/laird.pwn -i pawno/include -d3 -Z

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          path: project/**/*.amx
