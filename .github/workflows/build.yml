name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.10-linux
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y unzip git

      - name: Clone repo
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Unzip project
        run: |
          unzip mod.zip -d ./project
          echo "=== Содержимое папки project ==="
          ls -la ./project

      - name: Compile Laird
        run: |
          # Ищем файл laird.pwn во всех вложенных папках
          PWN_FILE=$(find ./project -name "laird.pwn" | head -n 1)
          
          if [ -z "$PWN_FILE" ]; then
            echo "ОШИБКА: Файл laird.pwn не найден!"
            exit 1
          fi
          
          echo "=== Найден файл: $PWN_FILE ==="
          
          # Переходим в папку, где лежит файл (скорее всего, это gamemodes)
          cd $(dirname "$PWN_FILE")
          
          # Запускаем компилятор, подсовывая ему все возможные варианты путей к инклудам
          # Мы используем -i несколько раз, чтобы он искал в разных местах
          pawncc laird.pwn \
            -i pawno/include \
            -i ../pawno/include \
            -i include \
            -i ../include \
            -i ../../pawno/include \
            -d3 -Z

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          # Ищем файл .amx, где бы он ни оказался
          path: project/**/*.amx
