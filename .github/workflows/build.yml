name: Build Laird Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: sacnr/pawncc
    steps:
      - name: Install git
        run: |
          apt-get update && apt-get install -y git

      - name: Clone repo
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Unzip project
        run: |
          unzip mod.zip -d ./project
          ls -la ./project

      - name: Compile Laird
        run: |
          cd ./project
          /pawnc/bin/pawncc gamemodes/laird.pwn -i pawno/include -d3 -Z

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: laird-amx
          path: project/**/*.amx
